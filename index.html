<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canlı TV - a3468tv</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial}
.header{position:sticky;top:0;z-index:99;background:#000;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
.header img{height:32px}
.player-wrap{position:sticky;top:52px;z-index:90;background:#000;aspect-ratio:16/9;width:100%;max-height:65vh}
video{width:100%;height:100%;background:#000}
.logo{position:absolute;top:12px;left:12px;width:110px;opacity:.9;pointer-events:none;z-index:5}
.live{position:absolute;top:12px;right:12px;background:#ff0000;padding:4px 8px;font-size:12px;border-radius:4px;font-weight:bold}
.list{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:#1e1e1e;border:1px solid #333;padding:12px;border-radius:10px;text-align:center;cursor:pointer}
.ch.active{border-color:#ff0000;background:#2a1a1a}
.ch span{display:block;font-size:12px;opacity:.6;margin-top:4px}
a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div class="header">
<img src="logo.png"><b>a3468tv/m</b>
</div>

<div class="player-wrap">
<img class="logo" src="logo.png">
<div class="live">● CANLI</div>
<video id="video" controls autoplay playsinline></video>
</div>

<div class="list">
<div class="ch" onclick="playChannel('showturk')"><b>SHOW TURK</b><span>?s</span></div>
<div class="ch" onclick="playChannel('bein1')"><b>BEIN 1</b><span>?b</span></div>
<div class="ch" onclick="playChannel('trt1')"><b>TRT 1</b><span>?trt</span></div>
<div class="ch" onclick="playChannel('test')"><b>TEST</b><span>?test</span></div>
</div>

<script>
// BURAYA KENDİ m3u8'LERİNİ YAZ
// Tokenlı resmi linkler buraya yazma, 2 saatte ölür
const channels = {
  showturk: "https://ladyboy.ardatvgs.cfd//s-sport/tracks-v1a1/mono.m3u8", // kendi linkini buraya
  bein1: "https://andro.evrenesoglu157.click/checklist/batutest.m3u8",
  trt1: "https://corestream.siteyaptim.live/hls/bein1.m3u8",
  test: "https://5ln.zirvedesin244.cfd/zirve/mono.m3u8"
};

const shortMap = {s:'showturk', b:'bein1', trt:'trt1', test:'test'};

function playChannel(id){
  const src = channels[id];
  const video = document.getElementById('video');
  document.querySelectorAll('.ch').forEach(e=>e.classList.remove('active'));
  // aktif işaretle
  if(Hls.isSupported()){const hls=new Hls();hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play())}
  else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=src;video.play()}
  history.replaceState(null,'','?'+Object.keys(shortMap).find(k=>shortMap[k]==id));
}

const p = new URLSearchParams(location.search);
const q = location.search.replace('?','').split('&')[0];
let start = shortMap[q] || 'showturk';
playChannel(start);
</script>
</body>
</html>
